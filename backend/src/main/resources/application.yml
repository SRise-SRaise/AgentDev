# 公共配置文件
spring:
  application:
    name: springboot
  # 默认 dev 环境
  profiles:
    active: dev
  # session 配置
  session:
    # todo 取消注释开启分布式 session（须先配置 Redis）
    # store-type: redis
    # 30 天过期
    timeout: 2592000
  # 数据库配置
  # todo 需替换配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/db
    username: root
    password: 123456
  # Redis 配置
  # todo 需替换配置，然后取消注释
#  redis:
#    database: 1
#    host: localhost
#    port: 6379
#    timeout: 5000
#    password: 123456
  # Elasticsearch 配置
  # todo 需替换配置，然后取消注释
#  elasticsearch:
#    uris: http://localhost:9200
#    username: root
#    password: 123456
  # 文件上传
  servlet:
    multipart:
      # 大小限制
      max-file-size: 10MB
  # Spring AI 配置（OpenAI 兼容协议）
  ai:
    openai:
      base-url: https://open.bigmodel.cn/api/paas/v4
      api-key: ${ZHIPUAI_API_KEY:xxx}
      chat:
        options:
          model: glm-4-flash
          temperature: 0.7
      embedding:
        options:
          model: embedding-2
  web:
    resources:
      static-locations: classpath:/static/
app:
  storage:
    root-path: storage
server:
  address: 0.0.0.0
  port: 8101
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
# 微信相关
wx:
  # 微信公众平台
  # todo 需替换配置
  mp:
    token: xxx
    aesKey: xxx
    appId: xxx
    secret: xxx
    config-storage:
      http-client-type: HttpClient
      key-prefix: wx
      redis:
        host: 127.0.0.1
        port: 6379
      type: Memory
  # 微信开放平台
  # todo 需替换配置
  open:
    appId: xxx
    appSecret: xxx
# 对象存储
# todo 需替换配置
cos:
  client:
    accessKey: xxx
    secretKey: xxx
    region: xxx
    bucket: xxx
# AI 多模型配置
ai:
  models:
    fast:
      model: glm-4-flash
      temperature: 0.7
    smart:
      model: glm-4-plus
      temperature: 0.5
    embedding:
      model: embedding-2
# Docker 配置
docker:
  # todo 需替换为实际 Docker 连接地址（Windows: tcp://localhost:2375, Linux: unix:///var/run/docker.sock）
  host: unix:///var/run/docker.sock
  tls-verify: false
  max-connections: 100
  connection-timeout-seconds: 30
  response-timeout-seconds: 120
