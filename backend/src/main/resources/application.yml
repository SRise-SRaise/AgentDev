# Base application config
spring:
  application:
    name: springboot
  profiles:
    active: dev
  session:
    timeout: 2592000
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/web_advanced_platform
    username: root
    password: 123456
  servlet:
    multipart:
      max-file-size: 10MB
  ai:
    openai:
      base-url: https://open.bigmodel.cn/api/paas/v4
      api-key: ${ZHIPUAI_API_KEY:xxx}
      chat:
        options:
          model: glm-4-flash
          temperature: 0.7
      embedding:
        options:
          model: embedding-2
  web:
    resources:
      static-locations: classpath:/static/

app:
  storage:
    root-path: storage

server:
  address: 0.0.0.0
  port: 8101
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

wx:
  mp:
    token: xxx
    aesKey: xxx
    appId: xxx
    secret: xxx
    config-storage:
      http-client-type: HttpClient
      key-prefix: wx
      redis:
        host: 127.0.0.1
        port: 6379
      type: Memory
  open:
    appId: xxx
    appSecret: xxx

cos:
  client:
    accessKey: xxx
    secretKey: xxx
    region: xxx
    bucket: xxx

ai:
  models:
    fast:
      model: glm-4-flash
      temperature: 0.7
    smart:
      model: glm-4-plus
      temperature: 0.5
    embedding:
      model: embedding-2

docker:
  host: unix:///var/run/docker.sock
  tls-verify: false
  max-connections: 100
  connection-timeout-seconds: 30
  response-timeout-seconds: 120

knife4j:
  enable: true
  openapi:
    title: API Docs
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.springboot.module
          - com.springboot.template.controller
